<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Galeria Graficzna</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; padding: 25px; text-align: center; background: #fafafa; }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        .gallery { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .img-card { background: white; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); width: 200px; }
        .img-card svg { width: 100%; height: 120px; border-radius: 4px; }
        .img-card p { margin-top: 8px; font-size: 13px; font-weight: bold; color: #555; }
    </style>
</head>
<body>
    <h2>Elementy graficzne osadzone w dokumencie</h2>
    <div class="gallery">
        <div class="img-card">
            <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#3498db"/><text x="50" y="55" fill="white" font-size="14" text-anchor="middle">Apache 2.4</text></svg>
            <p>Rysunek 1: Serwer HTTP</p>
        </div>
        <div class="img-card">
            <svg viewBox="0 0 100 100"><rect width="90" height="90" x="5" y="5" rx="10" fill="#e74c3c"/><text x="50" y="55" fill="white" font-size="14" text-anchor="middle">HTML5 & CSS</text></svg>
            <p>Rysunek 2: Frontend</p>
        </div>
        <div class="img-card">
            <svg viewBox="0 0 100 100"><polygon points="50,5 95,90 5,90" fill="#2ecc71"/><text x="50" y="65" fill="white" font-size="14" text-anchor="middle">PHP 8</text></svg>
            <p>Rysunek 3: Backend</p>
        </div>
    </div>
</body>
</html>
