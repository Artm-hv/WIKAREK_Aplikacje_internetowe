# ZADANIE 2: Podstawowy katalog dokumentow serwera
DocumentRoot "D:/Studenci/Cw_01/3ID11B_01"
<Directory "D:/Studenci/Cw_01/3ID11B_01">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# ZADANIE 3: Nasluch serwera na portach 80 i 8080
Listen 8080

# ZADANIE 4: Domyslne pliki startowe
DirectoryIndex st.html index.php index.html

# ZADANIE 15: Format i sciezka logowania (czas; IP klienta; domena; przegladarka)
LogFormat "%t %h %v \"%{User-Agent}i\"" lab1_log_format
CustomLog "D:/Studenci/Cw_01/3ID11B_01/historia/p.log" lab1_log_format

# ZADANIE 9: Globalne pliki bledow dla calego serwera
Alias /err/ "D:/Studenci/Cw_01/3ID11B_01/error/"
<Directory "D:/Studenci/Cw_01/3ID11B_01/error">
    Require all granted
</Directory>
ErrorDocument 404 /err/404.html
ErrorDocument 403 /err/403.html
ErrorDocument 500 /err/500.html

# ==============================================================================
# ZADANIE 5 & 6 & 12: WIRTUALNE HOSTY
# ==============================================================================

# 5.a & 6 & 12.a: www.meble.pl (IP 10.0.2.2:80, dostep z dowolnych adresow)
<VirtualHost 10.0.2.2:80>
    ServerName www.meble.pl
    ServerAlias meble.pl
    DocumentRoot "D:/Studenci/Cw_01/3ID11B_01/meble"
    DirectoryIndex start.html st.html index.php
    
    # Zadanie 10: Pliki bledow dla domeny meble.pl
    ErrorDocument 404 /error/404.html
    
    # Zadanie 13: Lokacja status wyswietlajaca server-status
    <Location /status>
        SetHandler server-status
        Require all granted
    </Location>
</VirtualHost>

<Directory "D:/Studenci/Cw_01/3ID11B_01/meble">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
    
    # Zadanie 11: Plik bledu 403 dla katalogu meble
    ErrorDocument 403 /error/403.html
</Directory>

# 5.b & 6 & 12.b: www.auta.pl (IP 10.0.3.3:80, dostep na haslo st:st)
<VirtualHost 10.0.3.3:80>
    ServerName www.auta.pl
    ServerAlias auta.pl
    DocumentRoot "D:/Studenci/Cw_01/3ID11B_01/auta"
    DirectoryIndex start.html st.html index.php
</VirtualHost>

<Directory "D:/Studenci/Cw_01/3ID11B_01/auta">
    Options Indexes FollowSymLinks
    AllowOverride None
    AuthType Basic
    AuthName "Auta - Wymagana autoryzacja studenta"
    AuthUserFile "D:/Studenci/Cw_01/3ID11B_01/hasla.has"
    Require user st
</Directory>

# 5.c & 7 & 8: www.meble.pl (IP 10.0.2.2:8080, indeksowanie meble80)
<VirtualHost 10.0.2.2:8080>
    ServerName www.meble.pl
    ServerAlias meble.pl
    DocumentRoot "D:/Studenci/Cw_01/3ID11B_01/meble80"
</VirtualHost>

<Directory "D:/Studenci/Cw_01/3ID11B_01/meble80">
    # Zadanie 8: Opcje indeksowania, naglowek z danymi zespolu i stopka
    Options Indexes FollowSymLinks
    IndexOptions FancyIndexing FoldersFirst VersionSort NameWidth=* DescriptionWidth=*
    HeaderName naglowek.html
    ReadmeName stopka.html
    AllowOverride None
    Require all granted
</Directory>

# 5.d: www.auta.pl (IP 10.0.3.3:8080, katalog auta80)
<VirtualHost 10.0.3.3:8080>
    ServerName www.auta.pl
    ServerAlias auta.pl
    DocumentRoot "D:/Studenci/Cw_01/3ID11B_01/auta80"
    DirectoryIndex start.html st.html index.php
</VirtualHost>

<Directory "D:/Studenci/Cw_01/3ID11B_01/auta80">
    Options Indexes FollowSymLinks
    AllowOverride None
    AuthType Basic
    AuthName "Auta - Wymagana autoryzacja studenta"
    AuthUserFile "D:/Studenci/Cw_01/3ID11B_01/hasla.has"
    Require user st
</Directory>

# 5.e & 12.c: www.phpmyad.pl (IP 127.0.0.1:80, dostep TYLKO z 127.0.0.1)
<VirtualHost 127.0.0.1:80>
    ServerName www.phpmyad.pl
    ServerAlias phpmyad.pl
    DocumentRoot "C:/Oprogramowanie/Apache24/htdocs/phpMyAdmin"
</VirtualHost>

<Directory "C:/Oprogramowanie/Apache24/htdocs/phpMyAdmin">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require ip 127.0.0.1
</Directory>

# ==============================================================================
# ZADANIE 14: SZYFROWANE POLACZENIE SSL (PORT 443)
# ==============================================================================
Listen 443 https

<VirtualHost 10.0.2.2:443>
    ServerName www.meble.pl
    ServerAlias meble.pl
    DocumentRoot "D:/Studenci/Cw_01/3ID11B_01/meble443"
    DirectoryIndex start.html st.html index.php
    
    SSLEngine on
    SSLCertificateFile "D:/Studenci/Cw_01/3ID11B_01/ssl/meble.crt"
    SSLCertificateKeyFile "D:/Studenci/Cw_01/3ID11B_01/ssl/meble.key"
</VirtualHost>

<Directory "D:/Studenci/Cw_01/3ID11B_01/meble443">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>
